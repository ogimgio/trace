<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRACE · Link wallet</title>
  <link rel="icon" href="/logo.svg?v=2" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e5ecf0; --fg: #0e0f14; --muted: #5d6270; --card: #f8fafb; --border: #0e0f14;
      --accent: #5ec8f2; --accent-fg: #0e0f14; --link: #1580b5; --ok: #15803d; --error: #b91c1c;
      --display: 'Space Grotesk', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 'DM Sans', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 520px; margin: 56px auto; padding: 0 16px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    header h1 { margin: 0; font: 700 22px var(--display); letter-spacing: 0.14em; }
    h2 { margin: 0 0 10px; font: 700 26px/1.15 var(--display); letter-spacing: -0.01em; }
    p { margin: 0 0 12px; }
    .card { background: var(--card); border: 2.5px solid var(--border); border-radius: 18px; box-shadow: 5px 5px 0 var(--border); padding: 24px; margin-bottom: 18px; }
    pre { margin: 0; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
          color: var(--muted); background: #eef3f6; border: 1.5px solid var(--border); border-radius: 10px; }
    button { width: 100%; padding: 14px 20px; border: 2.5px solid var(--border); border-radius: 999px; background: var(--accent);
             color: var(--accent-fg); font: 700 14px 'DM Sans', sans-serif; text-transform: uppercase; letter-spacing: 0.05em;
             box-shadow: 0 4px 0 var(--border); cursor: pointer; transition: transform .12s, box-shadow .12s; }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 var(--border); }
    button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--border); }
    button:disabled { opacity: 0.6; cursor: default; }
    a { color: var(--link); }
    code { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: #e9ecf3; border: 1.5px solid var(--border); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere; }
    .muted { color: var(--muted); }
    .error { color: var(--error); }
    .ok { color: var(--ok); }
    h2.ok { color: var(--fg); }
    h2.ok::before { content: '✓'; display: inline-grid; place-items: center; width: 34px; height: 34px; margin-right: 10px; border: 2.5px solid var(--border); border-radius: 50%; background: var(--accent); font-size: 18px; vertical-align: 3px; }
    #msg { font-weight: 500; }
    .protected { margin: 14px 4px 0; font-size: 13px; color: var(--muted); text-align: center; }
    #msg:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <header><img src="/logo.svg?v=2" alt="" width="34" height="34"><h1>TRACE</h1></header>
    <div id="app"><p class="muted">Loading…</p></div>
    <p id="msg"></p>
  </main>
  <script type="module">
    const app = document.getElementById('app');
    const msg = document.getElementById('msg');
    const code = new URLSearchParams(location.search).get('code') ?? '';

    const show = (text, cls = 'error') => { msg.className = cls; msg.textContent = text; };
    const el = (tag, props = {}, ...children) => {
      const e = Object.assign(document.createElement(tag), props);
      e.append(...children);
      return e;
    };
    const short = (a) => `${a.slice(0, 4)}…${a.slice(-4)}`;

    // Phantom (and compatible wallets) expose a provider with connect() and signMessage().
    const provider = () => window.phantom?.solana ?? (window.solana?.signMessage ? window.solana : null);

    const toBase64 = (bytes) => btoa(String.fromCharCode(...bytes));

    // Device check (Fingerprint): loads the agent with the public key; at signing time it returns this visit's
    // event ID, which the server verifies with the secret key. Keeps bots and virtual machines out.
    const startDeviceCheck = (config) =>
      import(`https://fpjscdn.net/v4/${config.apiKey}`).then((Fingerprint) => Fingerprint.start({ region: config.region }));

    async function load() {
      const res = await fetch(`/api/link/${encodeURIComponent(code)}`);
      if (!res.ok) {
        app.replaceChildren(el('div', { className: 'card' }, el('p', { className: 'error', textContent: 'Invalid link. Start again from the TRACE extension.' })));
        return;
      }
      const challenge = await res.json();
      if (challenge.status !== 'valid') {
        const text = challenge.status === 'used' ? 'This link has already been used.' : 'This link has expired.';
        app.replaceChildren(el('div', { className: 'card' }, el('p', { textContent: `${text} Start again from the TRACE extension.` })));
        return;
      }

      const linking = challenge.action === 'link';
      // A wallet linked before the device check existed: same wallet, signed again from this browser.
      const reverify = linking && Boolean(challenge.wallet);
      const agent = linking && challenge.deviceCheck ? startDeviceCheck(challenge.deviceCheck) : null;
      agent?.catch(() => {}); // reported when the user clicks

      const button = el('button', { textContent: linking ? 'Connect Phantom and sign' : `Sign with ${short(challenge.wallet)} and unlink` });
      const title = reverify ? 'Verify your device' : linking ? 'Link your Solana wallet' : 'Unlink wallet';
      const intro = reverify
        ? 'TRACE now checks each browser to keep bots out. Sign once more with the wallet already linked to keep earning. Select this account in Phantom:'
        : linking
          ? 'Sign a message with Phantom to prove the wallet is yours. Your TRACE rewards will be sent there.'
          : 'For security, only the linked wallet can unlink itself. Select this account in Phantom:';
      app.replaceChildren(
        el('div', { className: 'card' },
          el('h2', { textContent: title }),
          el('p', { textContent: intro }),
          ...(challenge.wallet ? [el('p', {}, el('code', { textContent: challenge.wallet }))] : []),
          el('p', { className: 'muted', textContent: 'Signing is free and moves no funds. This is the message:' }),
          el('pre', { textContent: challenge.message }),
        ),
        button,
        ...(linking ? [el('p', { className: 'protected' },
          'Bot protection by ', el('a', { href: 'https://fingerprint.com', target: '_blank', rel: 'noopener', textContent: 'Fingerprint' }),
          ': it checks this browser once, so one machine cannot farm rewards with many wallets.')] : []),
      );

      button.addEventListener('click', async () => {
        const wallet = provider();
        if (!wallet) {
          show('Phantom not found. Install it from phantom.app, then reload this page.');
          return;
        }
        button.disabled = true;
        show('');
        try {
          const { publicKey } = await wallet.connect();
          const address = publicKey.toString();
          if (challenge.wallet && address !== challenge.wallet) {
            throw new Error(`Phantom has ${short(address)} selected: switch to account ${short(challenge.wallet)} and try again.`);
          }
          const { signature } = await wallet.signMessage(new TextEncoder().encode(challenge.message), 'utf8');
          let deviceEventId;
          if (agent) {
            try {
              deviceEventId = (await (await agent).get()).event_id;
            } catch {
              throw new Error('The device check could not run. Turn off ad or tracker blockers for this page, reload and try again.');
            }
          }
          const res = await fetch(`/api/link/${encodeURIComponent(code)}`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ wallet: address, signature: toBase64(signature), deviceEventId }),
          });
          const body = await res.json();
          if (!res.ok) throw new Error(body.error ?? `Error ${res.status}`);
          done(body);
        } catch (err) {
          button.disabled = false;
          // 4001 = the user rejected the request in Phantom
          show(err?.code === 4001 ? 'Signature cancelled.' : String(err?.message ?? err));
        }
      });
    }

    function done(result) {
      if (result.action === 'unlink') {
        app.replaceChildren(el('div', { className: 'card' },
          el('h2', { className: 'ok', textContent: 'Wallet unlinked' }),
          el('p', { textContent: 'You can now link another one from the TRACE extension. You can close this tab.' })));
        return;
      }
      const lines = [
        el('h2', { className: 'ok', textContent: 'Wallet linked' }),
        el('p', {}, el('code', { textContent: result.wallet })),
      ];
      const w = result.welcome;
      if (w?.status === 'sent') {
        lines.push(el('p', { textContent: `Welcome! We just sent you ${w.amount} TRACE. ` },
          el('a', { href: w.explorerUrl, target: '_blank', rel: 'noopener', textContent: 'View transaction ↗' })));
      } else if (w) {
        lines.push(el('p', { textContent: `Your ${w.amount} TRACE welcome bonus is queued and will arrive shortly.` }));
      }
      lines.push(el('p', { className: 'muted', textContent: 'You can close this tab: points and payouts are in the extension.' }));
      app.replaceChildren(el('div', { className: 'card' }, ...lines));
    }

    load().catch(() => show('Server unreachable.'));
  </script>
</body>
</html>
