<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRACE · Link wallet</title>
  <link rel="icon" href="/logo.svg?v=2" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <style>
    :root {
      --bg: #ffffff; --fg: #16181d; --muted: #6b7180; --card: #f4f5f7; --border: #e2e4e9;
      --accent: #5ec8f2; --accent-fg: #0e0f14; --link: #1580b5; --ok: #15803d; --error: #b91c1c;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15161a; --fg: #ececf1; --muted: #9a9fac; --card: #1f2026; --border: #2e3038;
        --accent: #5ec8f2; --accent-fg: #0e0f14; --link: #7fd4f5; --ok: #4ade80; --error: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 480px; margin: 48px auto; padding: 0 16px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    header h1 { margin: 0; font-size: 20px; letter-spacing: 0.12em; }
    h2 { margin: 0 0 8px; font-size: 17px; }
    p { margin: 0 0 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: var(--muted); }
    button { width: 100%; padding: 11px 12px; border: 0; border-radius: 8px; background: var(--accent);
             color: var(--accent-fg); font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    a { color: var(--link); }
    code { font-size: 13px; overflow-wrap: anywhere; }
    .muted { color: var(--muted); }
    .error { color: var(--error); }
    .ok { color: var(--ok); }
    #msg:empty { display: none; }
    .success { text-align: center; padding: 28px 20px; border: 1px solid var(--border); border-radius: 14px;
               background: var(--card); animation: pop 0.3s ease-out; }
    .success .check { width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center;
                      font-size: 36px; font-weight: 700; color: var(--ok); background: color-mix(in srgb, var(--ok) 18%, transparent); }
    .success h2 { font-size: 22px; }
    @keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .success { animation: none; } }
  </style>
</head>
<body>
  <main>
    <header><img src="/logo.svg" alt="" width="32" height="32"><h1>TRACE</h1></header>
    <div id="app"><p class="muted">Loading…</p></div>
    <p id="msg"></p>
  </main>
  <script type="module">
    const app = document.getElementById('app');
    const msg = document.getElementById('msg');
    const params = new URLSearchParams(location.search);
    const code = params.get('code') ?? '';
    // Set when the extension opened this page in a popup window: tell it when we are done, it closes the window.
    const extensionId = params.get('ext');
    const notifyExtension = (type) => {
      try { if (extensionId && window.chrome?.runtime?.sendMessage) chrome.runtime.sendMessage(extensionId, { type }); } catch {}
    };
    const closeHint = extensionId ? 'This window closes by itself.' : 'You can close this tab.';

    const show = (text, cls = 'error') => { msg.className = cls; msg.textContent = text; };
    const el = (tag, props = {}, ...children) => {
      const e = Object.assign(document.createElement(tag), props);
      e.append(...children);
      return e;
    };
    const short = (a) => `${a.slice(0, 4)}…${a.slice(-4)}`;

    // Phantom (and compatible wallets) expose a provider with connect() and signMessage().
    const provider = () => window.phantom?.solana ?? (window.solana?.signMessage ? window.solana : null);

    const toBase64 = (bytes) => btoa(String.fromCharCode(...bytes));

    async function load() {
      const res = await fetch(`/api/link/${encodeURIComponent(code)}`);
      if (!res.ok) {
        app.replaceChildren(el('div', { className: 'card' }, el('p', { className: 'error', textContent: 'Invalid link. Start again from the TRACE extension.' })));
        return;
      }
      const challenge = await res.json();
      if (challenge.status !== 'valid') {
        const text = challenge.status === 'used' ? 'This link has already been used.' : 'This link has expired.';
        app.replaceChildren(el('div', { className: 'card' }, el('p', { textContent: `${text} Start again from the TRACE extension.` })));
        return;
      }
      sign(challenge);
    }

    // Device check (Fingerprint): loads the agent with the public key and returns this visit's event ID,
    // which the server checks with the secret key. Started when the page loads, so it is ready at signing.
    function startDeviceCheck(config) {
      if (!config) return Promise.reject(new Error('The device check is not available on this server.'));
      return import(`https://fpjscdn.net/v4/${config.apiKey}`)
        .then((Fingerprint) => Fingerprint.start({ region: config.region }))
        .catch(() => { throw new Error('The device check could not load: disable ad or tracker blockers for this page and reload.'); });
    }

    // Sign the challenge with Phantom:  (to link: after a device check). The wallet that must sign:
    // to unlink, the linked one; to link on an extension that already has a wallet, that same one.
    function sign(challenge) {
      const linking = challenge.action === 'link';
      const mustUse = linking ? challenge.currentWallet : challenge.wallet;
      const agent = linking ? startDeviceCheck(challenge.deviceCheck) : null;
      agent?.catch(() => {}); // reported when the user clicks
      const button = el('button', { textContent: linking ? 'Connect Phantom and sign' : `Sign with ${short(challenge.wallet)} and unlink` });
      app.replaceChildren(
        el('div', { className: 'card' },
          el('h2', { textContent: linking ? 'Link your Solana wallet' : 'Unlink wallet' }),
          el('p', { textContent: linking
            ? 'Sign a message with Phantom to prove the wallet is yours. Your TRACE rewards will be sent there. A quick check of this browser runs too: each device can link one wallet.'
            : 'For security, only the linked wallet can unlink itself. Select this account in Phantom:' }),
          ...(linking && mustUse ? [el('p', { textContent: 'This extension is already linked to this wallet. Select it in Phantom:' })] : []),
          ...(mustUse ? [el('p', {}, el('code', { textContent: mustUse }))] : []),
          el('p', { className: 'muted', textContent: 'Signing is free and moves no funds. This is the message:' }),
          el('pre', { textContent: challenge.message }),
        ),
        button,
      );

      button.addEventListener('click', async () => {
        const wallet = provider();
        if (!wallet) {
          show('Phantom not found. Install it from phantom.app, then reload this page.');
          return;
        }
        button.disabled = true;
        show('');
        try {
          const { publicKey } = await wallet.connect();
          const address = publicKey.toString();
          if (mustUse && address !== mustUse) {
            throw new Error(`Phantom has ${short(address)} selected: switch to account ${short(mustUse)} and try again.`);
          }
          const { signature } = await wallet.signMessage(new TextEncoder().encode(challenge.message), 'utf8');
          // A fresh device check for every attempt: each one can be used only once.
          const deviceEventId = agent ? (await (await agent).get()).event_id : undefined;
          const res = await fetch(`/api/link/${encodeURIComponent(code)}`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ wallet: address, signature: toBase64(signature), deviceEventId }),
          });
          const body = await res.json();
          if (!res.ok) throw new Error(body.error ?? `Error ${res.status}`);
          done(body);
        } catch (err) {
          button.disabled = false;
          // 4001 = the user rejected the request in Phantom
          show(err?.code === 4001 ? 'Signature cancelled.' : String(err?.message ?? err));
        }
      });
    }

    function done(result) {
      notifyExtension(result.action === 'unlink' ? 'wallet-unlinked' : 'wallet-linked');
      if (result.action === 'unlink') {
        app.replaceChildren(el('div', { className: 'card' },
          el('h2', { className: 'ok', textContent: 'Wallet unlinked' }),
          el('p', { textContent: 'To earn again from this computer, link this same wallet: each device can only link one wallet. ' + closeHint })));
        return;
      }
      // Success popup: the extension then shows the summary of the shared data and its reward.
      const w = result.welcome;
      app.replaceChildren(el('div', { className: 'success', role: 'dialog', ariaModal: 'true' },
        el('div', { className: 'check', textContent: '✓', ariaHidden: 'true' }),
        el('h2', { textContent: 'Wallet connected successfully' }),
        el('p', {}, el('code', { textContent: result.wallet })),
        el('p', { textContent: 'Back in the TRACE extension you will see what your shared data is worth and claim your TRACE.' }),
        ...(w ? [el('p', { className: 'muted', textContent: `Plus a welcome bonus: ${w.installment} TRACE every week you browse at least ${w.minActiveDays} days, up to ${w.total} TRACE.` })] : []),
        el('p', { className: 'muted', textContent: closeHint }),
      ));
    }

    load().catch(() => show('Server unreachable.'));
  </script>
</body>
</html>
