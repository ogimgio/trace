<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRACE · Link wallet</title>
  <link rel="icon" href="/logo.svg">
  <style>
    :root {
      --bg: #ffffff; --fg: #16181d; --muted: #6b7180; --card: #f4f5f7; --border: #e2e4e9;
      --accent: #5ec8f2; --accent-fg: #0e0f14; --link: #1580b5; --ok: #15803d; --error: #b91c1c;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15161a; --fg: #ececf1; --muted: #9a9fac; --card: #1f2026; --border: #2e3038;
        --accent: #5ec8f2; --accent-fg: #0e0f14; --link: #7fd4f5; --ok: #4ade80; --error: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 480px; margin: 48px auto; padding: 0 16px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    header h1 { margin: 0; font-size: 20px; letter-spacing: 0.12em; }
    h2 { margin: 0 0 8px; font-size: 17px; }
    p { margin: 0 0 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: var(--muted); }
    button { width: 100%; padding: 11px 12px; border: 0; border-radius: 8px; background: var(--accent);
             color: var(--accent-fg); font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    a { color: var(--link); }
    code { font-size: 13px; overflow-wrap: anywhere; }
    .muted { color: var(--muted); }
    .error { color: var(--error); }
    .ok { color: var(--ok); }
    #msg:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <header><img src="/logo.svg" alt="" width="32" height="32"><h1>TRACE</h1></header>
    <div id="app"><p class="muted">Caricamento…</p></div>
    <p id="msg"></p>
  </main>
  <script type="module">
    const app = document.getElementById('app');
    const msg = document.getElementById('msg');
    const code = new URLSearchParams(location.search).get('code') ?? '';

    const show = (text, cls = 'error') => { msg.className = cls; msg.textContent = text; };
    const el = (tag, props = {}, ...children) => {
      const e = Object.assign(document.createElement(tag), props);
      e.append(...children);
      return e;
    };
    const short = (a) => `${a.slice(0, 4)}…${a.slice(-4)}`;

    // Phantom (and compatible wallets) expose a provider with connect() and signMessage().
    const provider = () => window.phantom?.solana ?? (window.solana?.signMessage ? window.solana : null);

    const toBase64 = (bytes) => btoa(String.fromCharCode(...bytes));

    async function load() {
      const res = await fetch(`/api/link/${encodeURIComponent(code)}`);
      if (!res.ok) {
        app.replaceChildren(el('div', { className: 'card' }, el('p', { className: 'error', textContent: 'Invalid link. Start again from the TRACE extension.' })));
        return;
      }
      const challenge = await res.json();
      if (challenge.status !== 'valid') {
        const text = challenge.status === 'used' ? 'This link has already been used.' : 'This link has expired.';
        app.replaceChildren(el('div', { className: 'card' }, el('p', { textContent: `${text} Start again from the TRACE extension.` })));
        return;
      }

      const linking = challenge.action === 'link';
      const button = el('button', { textContent: linking ? 'Connect Phantom and sign' : `Sign with ${short(challenge.wallet)} and unlink` });
      app.replaceChildren(
        el('div', { className: 'card' },
          el('h2', { textContent: linking ? 'Link your Solana wallet' : 'Unlink wallet' }),
          el('p', { textContent: linking
            ? 'Sign a message with Phantom to prove the wallet is yours. Your TRACE rewards will be sent there.'
            : 'For security, only the linked wallet can unlink itself. Select this account in Phantom:' }),
          ...(linking ? [] : [el('p', {}, el('code', { textContent: challenge.wallet }))]),
          el('p', { className: 'muted', textContent: 'Signing is free and moves no funds. This is the message:' }),
          el('pre', { textContent: challenge.message }),
        ),
        button,
      );

      button.addEventListener('click', async () => {
        const wallet = provider();
        if (!wallet) {
          show('Phantom not found. Install it from phantom.app, then reload this page.');
          return;
        }
        button.disabled = true;
        show('');
        try {
          const { publicKey } = await wallet.connect();
          const address = publicKey.toString();
          if (!linking && address !== challenge.wallet) {
            throw new Error(`Phantom has ${short(address)} selected: switch to account ${short(challenge.wallet)} and try again.`);
          }
          const { signature } = await wallet.signMessage(new TextEncoder().encode(challenge.message), 'utf8');
          const res = await fetch(`/api/link/${encodeURIComponent(code)}`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ wallet: address, signature: toBase64(signature) }),
          });
          const body = await res.json();
          if (!res.ok) throw new Error(body.error ?? `Error ${res.status}`);
          done(body);
        } catch (err) {
          button.disabled = false;
          // 4001 = the user rejected the request in Phantom
          show(err?.code === 4001 ? 'Signature cancelled.' : String(err?.message ?? err));
        }
      });
    }

    function done(result) {
      if (result.action === 'unlink') {
        app.replaceChildren(el('div', { className: 'card' },
          el('h2', { className: 'ok', textContent: 'Wallet unlinked' }),
          el('p', { textContent: 'You can now link another one from the TRACE extension. You can close this tab.' })));
        return;
      }
      const lines = [
        el('h2', { className: 'ok', textContent: 'Wallet linked' }),
        el('p', {}, el('code', { textContent: result.wallet })),
      ];
      const w = result.welcome;
      if (w?.status === 'sent') {
        lines.push(el('p', { textContent: `Welcome! We just sent you ${w.amount} TRACE. ` },
          el('a', { href: w.explorerUrl, target: '_blank', rel: 'noopener', textContent: 'View transaction ↗' })));
      } else if (w) {
        lines.push(el('p', { textContent: `Your ${w.amount} TRACE welcome bonus is queued and will arrive shortly.` }));
      }
      lines.push(el('p', { className: 'muted', textContent: 'You can close this tab: points and payouts are in the extension.' }));
      app.replaceChildren(el('div', { className: 'card' }, ...lines));
    }

    load().catch(() => show('Server unreachable.'));
  </script>
</body>
</html>
